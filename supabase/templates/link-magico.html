<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#FFF3EC;font-family:Nunito,Arial,sans-serif;color:#1F2A44;">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:32px;">
      <tr><td>
        <p style="font-size:24px;font-weight:700;margin:0 0 16px;">tia<span style="color:#E5533A;">conta</span></p>
        <p style="font-size:18px;margin:0 0 24px;">Toque no botão para entrar:</p>
        <p style="margin:0 0 24px;">
          <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
             style="display:inline-block;background:#1F2A44;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:18px;padding:14px 28px;border-radius:20px;">
            Entrar no TiaConta
          </a>
        </p>
        <p style="font-size:16px;margin:0 0 8px;">Ou digite este código no app:</p>
        <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 24px;">{{ .Token }}</p>
        <p style="font-size:14px;color:#5B6478;margin:0;">O link e o código valem por 1 hora. Se não foi você quem pediu, é só ignorar este e-mail.</p>
      </td></tr>
    </table>
  </body>
</html>
